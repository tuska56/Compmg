<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MgComp Matrix Editor Pro</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #e0e0e0; margin: 20px; }
        .container { max-width: 1000px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #4a9eff; border-bottom: 2px solid #444; padding-bottom: 10px; }
        .toolbar { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; background: #383838; padding: 15px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #1e1e1e; }
        th { background: #4a9eff; color: white; padding: 10px; position: sticky; top: 0; }
        td { border: 1px solid #444; padding: 2px; }
        input { width: 100%; background: transparent; border: none; color: #00ff41; padding: 8px; box-sizing: border-box; font-family: 'Courier New', monospace; text-align: right; }
        input:focus { background: #333; outline: 1px solid #4a9eff; }
        input:hover { background: #252525; }
        .row-idx { background: #333; color: #888; text-align: center; width: 40px; font-size: 0.8em; }
        .btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .btn-load { background: #4a9eff; color: white; }
        .btn-save { background: #28a745; color: white; }
        .status { margin-top: 10px; font-size: 0.9em; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h1>MgComp Binary Editor <small style="font-size: 0.5em; color: #888;">v4.0 Matrix Mode</small></h1>
    
    <div class="toolbar">
        <input type="file" id="fileInput" style="display:none" accept=".MgComp">
        <button class="btn btn-load" onclick="document.getElementById('fileInput').click()">Cargar Archivo</button>
        <button class="btn btn-save" onclick="saveFile()">Guardar y Exportar</button>
        <div id="fileInfo" class="status">Esperando archivo...</div>
    </div>

    <div style="overflow-x:auto; max-height: 600px;">
        <table id="dataTable">
            <thead>
                <tr>
                    <th class="row-idx">#</th>
                    <th>Col 1 (TX)</th>
                    <th>Col 2 (TY)</th>
                    <th>Col 3 (TZ)</th>
                    <th>Col 4 (RX)</th>
                    <th>Col 5 (RY)</th>
                    <th>Col 6 (RZ)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    let originalBuffer;
    let fileName = "edited_file.MgComp";
    const BYTES_PER_VALUE = 8; // Float64
    const COLS = 6;
    const ROW_SIZE = BYTES_PER_VALUE * COLS; // 48 bytes por fila

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        fileName = file.name;
        
        const reader = new FileReader();
        reader.onload = function(event) {
            originalBuffer = event.target.result;
            renderMatrix();
            document.getElementById('fileInfo').innerText = `Archivo: ${fileName} | Tamaño: ${originalBuffer.byteLength} bytes`;
        };
        reader.readAsArrayBuffer(file);
    });

    function renderMatrix() {
        const view = new DataView(originalBuffer);
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        const totalRows = Math.floor(originalBuffer.byteLength / ROW_SIZE);

        for (let r = 0; r < totalRows; r++) {
            const tr = document.createElement('tr');
            
            // Índice de fila
            const tdIdx = document.createElement('td');
            tdIdx.className = 'row-idx';
            tdIdx.innerText = r;
            tr.appendChild(tdIdx);

            for (let c = 0; c < COLS; c++) {
                const offset = (r * ROW_SIZE) + (c * BYTES_PER_VALUE);
                const val = view.getFloat64(offset, true); // Little Endian
                
                const td = document.createElement('td');
                const input = document.createElement('input');
                input.type = 'text';
                // Formateo legible: si es muy pequeño, mostrar 0, si es normal, 8 decimales
                input.value = (Math.abs(val) < 1e-15) ? "0.00000000" : val.toFixed(8);
                
                input.dataset.offset = offset;
                input.onchange = function() {
                    updateBuffer(this.dataset.offset, this.value);
                };

                td.appendChild(input);
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }
    }

    function updateBuffer(offset, value) {
        const view = new DataView(originalBuffer);
        const numValue = parseFloat(value);
        if (!isNaN(numValue)) {
            view.setFloat64(parseInt(offset), numValue, true);
            console.log(`Guardado: ${numValue} en offset ${offset}`);
        }
    }

    function saveFile() {
        if (!originalBuffer) return alert("Primero carga un archivo.");
        
        const blob = new Blob([originalBuffer], { type: "application/octet-stream" });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "MOD_" + fileName;
        link.click();
    }
</script>

</body>
</html>
