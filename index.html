<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Corrección por Mínimos Cuadrados</title>
<style>
body { font-family: Arial; margin: 30px; }
textarea { width: 100%; height: 150px; }
button { margin: 5px 0; padding: 8px 12px; }
.resultado { margin-top: 15px; font-weight: bold; }
</style>
</head>
<body>

<h2>Corrección de Error por Mínimos Cuadrados</h2>

<p>Pega los datos en formato:</p>
<p><b>posición,error</b></p>
<p>Ejemplo:</p>
<pre>
0,2
100,8
200,15
300,21
</pre>

<textarea id="datos"></textarea>

<br>
<label>
<input type="checkbox" id="quitarOffset" checked>
Quitar pendiente y offset
</label>

<br>
<button onclick="calcular()">Calcular</button>
<button onclick="descargarCSV()">Descargar fichero corregido</button>

<div class="resultado" id="resultado"></div>

<script>

let datosProcesados = [];
let erroresCorregidos = [];

function calcular() {

    const texto = document.getElementById("datos").value.trim();
    const lineas = texto.split("\n");

    let x = [];
    let e = [];

    lineas.forEach(linea => {
        const partes = linea.split(",");
        if (partes.length === 2) {
            x.push(parseFloat(partes[0]));
            e.push(parseFloat(partes[1]));
        }
    });

    const n = x.length;

    const mediaX = x.reduce((a,b)=>a+b,0)/n;
    const mediaE = e.reduce((a,b)=>a+b,0)/n;

    let num = 0;
    let den = 0;

    for (let i=0;i<n;i++){
        num += (x[i]-mediaX)*(e[i]-mediaE);
        den += (x[i]-mediaX)*(x[i]-mediaX);
    }

    const b = num/den;
    const a = mediaE - b*mediaX;

    erroresCorregidos = [];

    const quitarOffset = document.getElementById("quitarOffset").checked;

    for (let i=0;i<n;i++){
        if (quitarOffset){
            erroresCorregidos.push(e[i] - (a + b*x[i]));
        } else {
            erroresCorregidos.push(e[i] - b*x[i]);
        }
    }

    datosProcesados = x;

    document.getElementById("resultado").innerHTML =
        "Pendiente (b): " + b.toFixed(8) +
        "<br>Intercepto (a): " + a.toFixed(8) +
        "<br>Pendiente en ppm (si µm/mm): " + (b*1000).toFixed(3);

}

function descargarCSV(){

    if (datosProcesados.length === 0){
        alert("Primero calcula.");
        return;
    }

    let contenido = "posicion,error_corregido\n";

    for (let i=0;i<datosProcesados.length;i++){
        contenido += datosProcesados[i] + "," + erroresCorregidos[i] + "\n";
    }

    const blob = new Blob([contenido], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "tabla_corregida.csv";
    a.click();

    URL.revokeObjectURL(url);
}

</script>

</body>
</html>
