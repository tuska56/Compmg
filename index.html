<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Analizador Universal MgComp</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        .panel { background: #2d2d2d; border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #0078d4; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        .data-section { background: #252525; border: 1px solid #444; margin-bottom: 20px; padding: 15px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #333; color: #aaa; font-size: 12px; padding: 8px; border: 1px solid #444; }
        td { border: 1px solid #333; }
        input[type="text"] { width: 100%; background: transparent; border: none; color: #2ecc71; text-align: right; padding: 5px; font-family: monospace; }
        input:focus { background: #111; outline: 1px solid #0078d4; }
        .btn { padding: 10px 20px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-load { background: #0078d4; color: white; }
        .btn-save { background: #27ae60; color: white; }
    </style>
</head>
<body>

<div class="panel">
    <h2>Explorador Dinámico de Ficheros MgComp</h2>
    <div class="controls">
        <input type="file" id="f" style="display:none" onchange="read(this)">
        <button class="btn btn-load" onclick="document.getElementById('f').click()">Cargar Cualquier MgComp</button>
        <button class="btn btn-save" onclick="save()">Guardar Cambios</button>
        <span id="status">Esperando archivo...</span>
    </div>

    <div id="results"></div>
</div>

<script>
    let buffer;
    let view;

    function read(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            buffer = e.target.result;
            view = new DataView(buffer);
            document.getElementById('status').innerText = "Analizando: " + file.name;
            analyze();
        };
        reader.readAsArrayBuffer(file);
    }

    function analyze() {
        const container = document.getElementById('results');
        container.innerHTML = '';
        const decoder = new TextDecoder('windows-1252');
        const text = decoder.decode(buffer);

        // 1. Buscar Squareness
        const sqIdx = text.indexOf("*** Squareness ***");
        if(sqIdx !== -1) {
            const section = createSection("Perpendicularidades (Squareness)");
            // Buscamos los valores decimales en el texto
            const values = text.substring(sqIdx, sqIdx + 200).match(/[+-]?\d+\.\d+/g);
            if(values) {
                section.innerHTML += `XY: ${values[0]} | YZ: ${values[1]} | ZX: ${values[2]}`;
            }
        }

        // 2. Buscar Cadena Cinemática
        const kcIdx = text.indexOf("*** Kinematic Chain ***");
        if(kcIdx !== -1) {
            const section = createSection("Cadena Cinemática");
            const values = text.substring(kcIdx, kcIdx + 100).match(/=\s*(\d+)/g);
            if(values) {
                section.innerHTML += `Configuración Ejes: ${values.join(' | ')}`;
            }
        }

        // 3. Buscar Tablas (Detección automática de ejes)
        const axes = ['X', 'Y', 'Z'];
        axes.forEach(axis => {
            // Buscamos la etiqueta del eje sola en una línea
            const axisPos = text.indexOf(`\n${axis}\n`);
            if(axisPos !== -1) {
                const section = createSection(`Tabla de Compensación - Eje ${axis}`);
                // Extraer Inicio, Fin y Paso (están justo después del nombre del eje)
                const meta = text.substring(axisPos, axisPos + 100).match(/[+-]?\d+\.\d+/g);
                if(meta) {
                    const start = parseFloat(meta[0]);
                    const end = parseFloat(meta[1]);
                    const step = parseFloat(meta[2]);
                    renderTable(section, axis, start, end, step);
                }
            }
        });
    }

    function createSection(title) {
        const div = document.createElement('div');
        div.className = 'data-section';
        div.innerHTML = `<div style="color:#0078d4; font-weight:bold; margin-bottom:10px">${title}</div>`;
        document.getElementById('results').appendChild(div);
        return div;
    }

    function renderTable(parent, axis, start, end, step) {
        const numRows = Math.abs((end - start) / step) + 1;
        let html = `<table><thead><tr><th>Pos</th><th>TX</th><th>TY</th><th>TZ</th><th>RX</th><th>RY</th><th>RZ</th></tr></thead><tbody>`;
        
        // Simulación de búsqueda de datos binarios tras el texto
        for(let i=0; i<numRows; i++) {
            const p = start + (i * step);
            html += `<tr>
                <td style="background:#111; font-size:10px; text-align:center">${axis}${p}</td>
                ${Array(6).fill(0).map(() => `<td><input type="text" value="0.00"></td>`).join('')}
            </tr>`;
        }
        html += `</tbody></table>`;
        parent.innerHTML += html;
    }

    function save() {
        if(!buffer) return;
        const blob = new Blob([buffer], {type: "application/octet-stream"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "MODIFICADO.MgComp";
        a.click();
    }
</script>

</body>
</html>
